<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product Slider</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="hero">
    <p class="hero__eyebrow">Color Palette Hacks</p>
    <h1 class="hero__title">Every shade, one at a time.</h1>
    <p class="hero__sub">A simple, clean look at the whole collection.</p>
  </header>

  <main class="slider-wrap">
    <div class="slider" id="slider">
      <button class="slider__nav slider__nav--prev" id="prevBtn" aria-label="Previous product">&#10094;</button>

      <div class="slider__track" id="track">
        <!-- Slides are injected here by script.js -->
      </div>

      <button class="slider__nav slider__nav--next" id="nextBtn" aria-label="Next product">&#10095;</button>
    </div>

    <div class="dots" id="dots"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
